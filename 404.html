<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page not found — Akavjah Creations</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/brand/favicon.ico" sizes="any">
  <link rel="icon" href="/brand/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png">

  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&display=swap" rel="stylesheet">
  <style>
    body{margin:0;background:#0F1424;color:#EAEAF2;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
      display:flex;min-height:100vh;align-items:center;justify-content:center;text-align:center;padding:24px}
    .card{max-width:420px}
    img{width:128px;height:128px;border-radius:24px;margin-bottom:26px;box-shadow:0 10px 28px rgba(0,0,0,.4)}
    h1{font-family:"Chakra Petch",sans-serif;font-weight:700;font-size:24px;margin:0 0 10px}
    p{color:#98A0B8;font-size:14.5px;line-height:1.6;margin:0 0 26px}
    .links{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
    a{color:#0F1424;background:#FFC85C;text-decoration:none;font-size:13.5px;font-weight:600;
      padding:9px 16px;border-radius:8px}
    a.ghost{background:transparent;color:#FFC85C;border:1px solid #4A557E}
  </style>
</head>
<body>
  <div class="card">
    <img src="/brand/logo-small.png" alt="Akavjah Creations">
    <h1 id="t">Page not found</h1>
    <p id="p">That page doesn't exist — but here's where to go instead.</p>
    <div class="links">
      <a id="home" href="/en/">Home</a>
      <a id="support" class="ghost" href="/support/en/">Support</a>
      <a id="privacy" class="ghost" href="/privacy/en/">Privacy</a>
    </div>
  </div>
  <script>
    var T = {"en": {t:"Page not found", p:"That page doesn't exist — but here's where to go instead.", home:"Home", support:"Support", privacy:"Privacy"},
"fr": {t:"Page introuvable", p:"Cette page n'existe pas — voici où aller à la place.", home:"Accueil", support:"Assistance", privacy:"Confidentialité"},
"it": {t:"Pagina non trovata", p:"Questa pagina non esiste — ecco dove andare invece.", home:"Home", support:"Assistenza", privacy:"Privacy"},
"es": {t:"Página no encontrada", p:"Esa página no existe — aquí tienes dónde ir en su lugar.", home:"Inicio", support:"Soporte", privacy:"Privacidad"},
"de": {t:"Seite nicht gefunden", p:"Diese Seite gibt es nicht — hier geht's stattdessen weiter.", home:"Start", support:"Support", privacy:"Datenschutz"},
"zh": {t:"页面未找到", p:"该页面不存在——不如去下面这些地方看看。", home:"首页", support:"支持", privacy:"隐私政策"},
"ja": {t:"ページが見つかりません", p:"そのページは存在しません — 代わりにこちらへどうぞ。", home:"ホーム", support:"サポート", privacy:"プライバシー"},
"ko": {t:"페이지를 찾을 수 없습니다", p:"해당 페이지는 존재하지 않습니다 — 대신 아래로 이동해 보세요.", home:"홈", support:"지원", privacy:"개인정보"}};
    var prefs = navigator.languages || [navigator.language || "en"];
    var match = "en";
    for (var i = 0; i < prefs.length; i++) {
      var code = String(prefs[i]).toLowerCase().split("-")[0];
      if (T[code]) { match = code; break; }
    }
    var d = T[match];
    document.getElementById("t").textContent = d.t;
    document.getElementById("p").textContent = d.p;
    document.getElementById("home").textContent = d.home;
    document.getElementById("home").href = "/" + match + "/";
    document.getElementById("support").textContent = d.support;
    document.getElementById("support").href = "/support/" + match + "/";
    document.getElementById("privacy").textContent = d.privacy;
    document.getElementById("privacy").href = "/privacy/" + match + "/";
  </script>
</body>
</html>
