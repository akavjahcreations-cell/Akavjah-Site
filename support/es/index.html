  <style>
:root{
  --bg:#0F1424; --ink:#EAEAF2; --muted:#98A0B8; --accent:#FFC85C;
  --ring:#4A557E; --line:#242C48; --maxw:680px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,
    "PingFang SC","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,
    "Apple SD Gothic Neo","Malgun Gothic","Microsoft YaHei",sans-serif;
  line-height:1.7; font-size:17px;
}
a{color:var(--accent); text-decoration:none}
a:hover,a:focus-visible{text-decoration:underline; text-underline-offset:3px}
a:focus-visible{outline:2px solid var(--accent); outline-offset:3px; border-radius:2px}
.wrap{max-width:var(--maxw); margin:0 auto; padding:0 22px}
header.site{
  display:flex; align-items:center; justify-content:space-between; gap:16px;
  padding:22px 0 0;
}
.brand{display:flex; align-items:center; gap:11px; color:var(--ink)}
.brand svg{display:block}
.brand .word{
  font-family:"Chakra Petch",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-weight:600; font-size:12px; letter-spacing:.32em; text-transform:uppercase;
}
.sitenav{display:flex; gap:22px; font-size:14.5px}
.sitenav a{color:var(--muted)}
.sitenav a:hover{color:var(--accent); text-decoration:none}
.sitenav a[aria-current="page"]{color:var(--accent); font-weight:600}
.brand-logo{height:34px; width:auto; display:block; border-radius:8px}
.crumb{
  margin:52px 0 10px; font-size:12.5px; letter-spacing:.18em; text-transform:uppercase;
  color:var(--accent);
}
h1{
  font-family:"Chakra Petch",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-weight:700; font-size:clamp(28px,6vw,40px); line-height:1.22;
  margin:0 0 18px; letter-spacing:.01em;
}
.lede{color:var(--muted); font-size:18px; margin:0 0 8px}
.updated{color:var(--muted); font-size:14px; margin:14px 0 0}
main{padding-bottom:8px}
section{margin-top:52px}
h2{
  font-family:"Chakra Petch",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-weight:600; font-size:20px; margin:0 0 14px; display:flex; align-items:center; gap:10px;
}
h2::before{
  content:""; width:11px; height:11px; border-radius:50%;
  border:2px solid var(--ring); flex:none;
  background:radial-gradient(circle at 78% 22%, var(--accent) 0 32%, transparent 34%);
}
p{margin:0 0 14px}
ol,ul{margin:0 0 14px; padding-left:1.4em}
li{margin:6px 0}
ol li::marker{color:var(--accent); font-weight:600}
ul li::marker{color:var(--ring)}
details{
  border-top:1px solid var(--line); padding:14px 2px;
}
details:last-of-type{border-bottom:1px solid var(--line)}
summary{
  cursor:pointer; font-weight:600; list-style:none;
  display:flex; justify-content:space-between; align-items:center; gap:12px;
}
summary::-webkit-details-marker{display:none}
summary::after{content:"+"; color:var(--accent); font-weight:600; font-size:18px; flex:none}
details[open] summary::after{content:"–"}
details p{margin:10px 0 2px; color:var(--muted)}
.note{color:var(--muted)}
.contact-card{
  margin-top:56px; padding:26px 24px; border:1px solid var(--line); border-radius:14px;
  background:linear-gradient(160deg, rgba(255,200,92,.05), rgba(255,200,92,0) 55%);
  display:flex; align-items:center; gap:20px; flex-wrap:wrap;
}
.contact-card .contact-logo{
  flex:none; width:128px; height:128px; border-radius:22px; box-shadow:0 8px 22px rgba(0,0,0,.4);
}
.contact-card .contact-info{flex:1 1 200px; min-width:0}
.contact-card .label{
  font-size:12.5px; letter-spacing:.18em; text-transform:uppercase; color:var(--muted); margin:0 0 6px;
}
.contact-card a{font-size:19px; font-weight:600; word-break:break-all}
.contact-card .addr-label{
  font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); margin:20px 0 6px;
}
.contact-card .addr{font-size:14.5px; color:var(--ink); line-height:1.6; margin:0}
.tm{font-size:.5em; vertical-align:super; margin-left:2px; font-weight:400; letter-spacing:0}
footer.site{margin-top:56px; padding:26px 0 44px; border-top:1px solid var(--line)}
.langs{display:flex; flex-wrap:wrap; gap:6px 16px; font-size:14px; margin:0 0 20px}
.langs a{color:var(--muted)}
.langs a:hover{color:var(--accent)}
.langs a[aria-current="true"]{color:var(--accent); font-weight:600; text-decoration:none}
.copy{color:var(--muted); font-size:13.5px; margin:0}
.tagline{color:var(--muted); font-size:13.5px; font-style:italic; margin:4px 0 0}

.hub-h1{margin-top:64px}
.hub-cards{display:flex; gap:18px; flex-wrap:wrap; margin-top:32px}
.hub-card{flex:1 1 220px; display:flex; flex-direction:column; gap:8px; padding:22px;
  border:1px solid var(--line); border-radius:16px; color:var(--ink); text-decoration:none;
  transition:border-color .15s}
.hub-card:hover{border-color:var(--accent); text-decoration:none}
.hub-card img{width:56px; height:56px; border-radius:14px; margin-bottom:6px}
.hub-name{font-family:"Chakra Petch",sans-serif; font-weight:700; font-size:19px}
.hub-blurb{color:var(--muted); font-size:14px}
.hub-cta{color:var(--accent); font-size:14px; font-weight:600; margin-top:8px}
</style>
</head>

    <p class="copy">© 2026 Akavjah Creations<sup class="tm">™</sup></p>
